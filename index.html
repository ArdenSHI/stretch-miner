<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stretch Miner · Help Granny Find Her Jewellery</title>
<style>
  :root {
    --bg: #2B1533;
    --line: #5C3A6B;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 18px 14px;
    min-height: 100vh;
  }
  /* the whole game lives in this one canvas: home, download bar, instructions, buttons */
  canvas {
    width: 960px; max-width: 100%; height: auto;
    background: #E08A2B; border: 3px solid var(--line); border-radius: 14px;
    display: block; touch-action: none;
  }
  /* never display:none — some browsers stop decoding frames of a hidden video, and pose is never produced */
  video { position: fixed; top: 0; left: 0; width: 2px; height: 2px; opacity: .01; pointer-events: none; }
  /* status line for screen readers only: sighted players already read it on the canvas */
  #a11y {
    position: absolute; width: 1px; height: 1px; margin: -1px;
    padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* hand touched a bug/plug: the whole window shakes */
  @keyframes quake {
    0%   { transform: translate(0, 0) rotate(0deg); }
    8%   { transform: translate(-12px, 6px) rotate(-.7deg); }
    18%  { transform: translate(10px, -8px) rotate(.6deg); }
    28%  { transform: translate(-9px, -5px) rotate(-.5deg); }
    38%  { transform: translate(11px, 7px) rotate(.55deg); }
    50%  { transform: translate(-8px, 4px) rotate(-.4deg); }
    62%  { transform: translate(7px, -5px) rotate(.35deg); }
    74%  { transform: translate(-5px, -3px) rotate(-.25deg); }
    86%  { transform: translate(4px, 2px) rotate(.15deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  body.quake { animation: quake .68s cubic-bezier(.36,.07,.19,.97) both; }
  @media (prefers-reduced-motion: reduce) { body.quake { animation: none; } }
</style>
</head>
<body>
  <canvas id="stage" width="960" height="640" aria-label="Stretch Miner · a camera-controlled game"></canvas>
  <div id="a11y" role="status" aria-live="polite"></div>

  <video id="cam" playsinline muted></video>
  <script type="module" src="game.js"></script>
</body>
</html>
